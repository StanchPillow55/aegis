# success_criteria.yaml — aegis single source of truth (Definition of Done)
# Every module merges ONLY when its criteria flip to pass: true WITH a linked artifact.
# QA/Validation node (llm-council + Phoenix + Sentry) enforces this. Fail closed.
meta:
  project: aegis
  tagline: "Voice-first daily training-decision copilot for functional longevity"
  budget: { claude_credits_usd: 30, gemini: "free AI Studio key" }
criteria:
  - id: SC-ENV-01
    module: Environment
    track: null
    criterion: "Repo runs end-to-end locally: backend boots, frontend serves, .env loaded"
    verify: "make dev starts both; smoke test green"
    pass: true
    artifact: "#1"
  - id: SC-REDIS-01
    module: Memory/Retrieval
    track: redis
    criterion: "Vector search returns prior grip/front-rack logs for a query; p95 < 150ms; uses Redis BEYOND caching (vector+memory+context retrieval)"
    verify: "pytest tests/test_redis_retrieval.py + Phoenix latency trace screenshot"
    pass: true
    artifact: "#5 (code) + #7 (green CI p95 evidence)"
  - id: SC-ANTH-01
