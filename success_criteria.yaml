meta:
  project: aegis
  tagline: "Voice-first daily training-decision copilot for functional longevity"
  budget: { claude_credits_usd: 30, gemini: "free AI Studio key" }

criteria:
  - id: OS-ENV-01
    module: Environment
    criterion: "local dev environment boots with no paid keys"
    verify: "make os-smoke"
    pass: false
    artifact: null
    notes: "Needs docker and python dependencies."
  
  - id: OS-LLM-01
    module: Intake/Extraction
    criterion: "default local or deterministic extractor produces valid IntakeResult from demo transcript"
    verify: "pytest tests/test_extraction.py"
    pass: false
    artifact: null
    notes: "Requires ollama running and llama3.2 pulled."

  - id: OS-VOICE-01
    module: Voice
    criterion: "local STT/TTS adapters are wired and testable"
    verify: "pytest tests/test_voice.py"
    pass: false
    artifact: null
    notes: "Requires faster-whisper and piper. Mocks available via USE_MOCK_SPEECH=true."

  - id: OS-MEMORY-01
    module: Memory/Retrieval
    criterion: "local vector retrieval returns relevant prior logs"
    verify: "pytest tests/test_memory.py"
    pass: false
    artifact: null
    notes: "Uses ChromaDB + SQLite locally."

  - id: OS-ORCH-01
    module: Orchestrator
    criterion: "orchestrator runs full intake -> memory -> scorers -> directive loop locally"
    verify: "pytest tests/test_orchestrator.py"
    pass: false
    artifact: null
    notes: "Replaces uAgents."

  - id: OS-BROWSER-01
    module: WOD Importer
    criterion: "local Playwright WOD importer extracts fixture WOD"
    verify: "pytest tests/test_wod_importer.py"
    pass: false
    artifact: null
    notes: "Requires playwright installed."

  - id: OS-OBS-01
    module: Observability
    criterion: "OpenTelemetry spans emitted for full loop"
    verify: "pytest tests/test_tracing.py"
    pass: false
    artifact: null
    notes: "Does not strictly require Jaeger to pass tests."

  - id: OS-DEMO-01
    module: Demo loop
    criterion: "one-command local demo loop works or reports missing setup cleanly"
    verify: "make os-demo"
    pass: false
    artifact: null
    notes: "Ensure OLLAMA_MODEL is pulled or mocked."

  - id: OS-HARDWARE-01
    module: Hardware
    criterion: "default local path documented and tested for M2/16 GB assumptions, with M4 stretch alternatives documented"
    verify: "make os-model-info and README.md check"
    pass: false
    artifact: null

