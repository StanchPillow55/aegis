name: OS Migration Validation

on:
  push:
    branches:
      - feat/os-migration-foundation
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall backend importer tests scripts

      - name: Check file sanity
        run: python scripts/check_file_sanity.py

      - name: Validate success criteria
        run: python scripts/validate_success_criteria.py

      - name: Run tests
        run: python -m pytest tests/ -q
