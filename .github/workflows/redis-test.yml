name: SC-REDIS-01 Redis retrieval

# The green run of this workflow IS the SC-REDIS-01 evidence artifact:
# it runs the vector-retrieval suite against a real redis-stack (RediSearch)
# and publishes the p95 retrieval latency to the job summary.

on:
  push:
    branches: [ci/redis-evidence, master]
    paths:
      - "backend/memory/**"
      - "tests/test_redis_retrieval.py"
      - ".github/workflows/redis-test.yml"
  pull_request:
    paths:
      - "backend/memory/**"
      - "tests/test_redis_retrieval.py"
      - ".github/workflows/redis-test.yml"
  workflow_dispatch:

jobs:
  redis-retrieval:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis/redis-stack:latest   # Redis + RediSearch (vector search) on 6379
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      # store.py reads settings via the fail-loud config, which requires all six
      # keys. Only REDIS_URL is real; the retrieval path never calls the others.
      REDIS_URL: redis://localhost:6379
      ANTHROPIC_API_KEY: ci-dummy
      GEMINI_API_KEY: ci-dummy
      SENTRY_DSN: ci-dummy
      DEEPGRAM_API_KEY: ci-dummy
      BROWSERBASE_API_KEY: ci-dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SC-REDIS-01 retrieval suite
        run: python -m pytest tests/test_redis_retrieval.py -v
